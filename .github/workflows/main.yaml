name: Build and Push Docker Image

# 언제 이 작업을 실행할까요?
on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 서버가 내 코드를 가져옵니다.
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Docker Hub에 로그인합니다.
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_HANO4578 }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. 이미지를 빌드하고 Docker Hub로 보냅니다.
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./dockers/Image
          file: ./dockers/Image/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_HANO4578 }}/my-ml-app:latest